<div class="page-head">
<div><h1>History</h1><p class="sub">Jobs slurm has a record of, newest first. Click a column heading to sort by it.</p></div>
</div>
<section class="card" aria-labelledby="h-history">
<h2 id="h-history" class="sr-only">Jobs</h2>
<form method="get" class="toolbar" aria-label="History filters">
<div class="field">Period <span class="segmented">$presets</span></div>
<label class="field">From <input type="date" name="since" value="$since"></label>
<label class="field">To <input type="date" name="until" value="$until"></label>
$fields
$kept
<button type="submit" class="primary">Apply</button>
</form>
$table
$pager
</section>
