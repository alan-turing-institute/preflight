<a class="back" href="../">← Queue</a>
<div class="page-head">
<div><h1>$title</h1><p class="sub">$subtitle</p></div>
<div>$buttons</div>
</div>
<p id="action-result" class="notice" role="status" aria-live="polite"></p>
<div class="grid">
<section class="card" aria-labelledby="h-details">
<div class="card-head"><h2 id="h-details">Details</h2></div>
<div class="card-body"><dl class="facts">$facts</dl></div>
</section>
<section class="card" aria-labelledby="h-resources">
<div class="card-head"><h2 id="h-resources">Resources</h2>$jobstats</div>
<div class="card-body">$resources</div>
</section>
</div>
<div class="grid">
<section class="card" aria-labelledby="h-timeline">
<div class="card-head"><h2 id="h-timeline">Timeline</h2></div>
<div class="card-body">$timeline</div>
</section>
<section class="card" aria-labelledby="h-chain">
<div class="card-head"><h2 id="h-chain">Dependencies</h2></div>
<div class="card-body chain">$chain</div>
</section>
</div>
<section class="card" aria-labelledby="h-log">
<div class="card-head"><h2 id="h-log">Log</h2><span class="meta mono">$log_path</span></div>
<form id="log-viewer" class="toolbar" data-job="$job_id">
<label class="field">Only lines containing <input name="text" type="search" placeholder="e.g. loss"></label>
<label class="check"><input name="errors" type="checkbox"> Errors and warnings only</label>
<button type="submit">Refresh</button>
</form>
<pre id="log-output" class="log" tabindex="0" aria-label="Log of job $job_id">Loading…</pre>
</section>
<section class="card">
<details class="code"><summary>Command and job script</summary><pre>$command</pre></details>
</section>
