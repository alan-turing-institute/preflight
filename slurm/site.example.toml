# Site file for the GPU job layer. Installed at /etc/gpujobs/site.toml (override with $GPUJOBS_SITE).
# `slurm/install/install.py detect` writes a starting point for the machine it runs on.
# Unknown keys are an error in every table. Keys with a default may be left out.

# Short name of this site (required).
name = "example-host"
# slurm's ClusterName, also the name of Open OnDemand's cluster file. Default: the site name. Never change it on
# a running cluster: slurmctld refuses to start when ClusterName differs from the one in its saved state.
# cluster_name = "example-host"
# The slurm account the installer creates and adds every user to (slurm admits only users it has an account for).
# Default: gpujobs
account = "gpujobs"
# Where the job layer keeps records and events. Default: /var/lib/gpujobs
state_dir = "/var/lib/gpujobs"
# Sharing cards only. The share of a node's job memory (0 to 1) that the jobs sharing one card may fill together, counted at
# their measured peaks. Default: unset, so they may fill all the memory the node hands to jobs.
# sharing_memory_fraction = 0.5
# Cores for a CPU-only job given --name and no --cpus, from its last 3 completed runs (their highest average cores in use
# x 1.25, rounded up): "off", "recommend" (print the figure, ask as before) or "enforce" (ask for it). Default: recommend
# cpus_from_history = "recommend"
# Where the code is installed. Default: /opt/gpujobs
install_dir = "/opt/gpujobs"
# Unix group of admins: they may act on anyone's jobs and submit urgent work. Default: gpujobs-admin
admin_group = "gpujobs-admin"
# True when the GPU shares system memory with the host (nvidia-smi reports memory.total as N/A). Default: false
unified_memory = false
# Install the host memory guard on GPU jobs. Default: false
hostguard = false
# Require the DGX submission gate for jobs submitted with --entry. Default: false
dgx_gate = false
# Confine each job to the GPUs it holds (cgroup.conf ConstrainDevices). Turn off only where the host cannot load slurm's
# BPF device filter (a container): slurm 26.05 fails every job launch there, 23.11 only logged it. Default: true
constrain_devices = true
# Part-time machines only. True when they mount this state_dir (one shared filesystem): then no job state is copied back
# from them. Default: false (the agent copies each machine's state_dir here every minute, over ssh, read-only)
# shared_state = false
# The interpreter a job's wrapper runs with on a part-time machine, whose own paths are not the submitter's. Default: /usr/bin/python3
# node_python = "/usr/bin/python3"
# Command (argv, no shell) run once per notice: a failed job, or an idle finding told to both the waiting and the
# holding job's side. The notice is in its environment (GPUJOBS_EVENT, _JOB, _NAME, _PROJECT, _USER, _MESSAGE, and
# _STATE or _ROLE, _OTHER_JOB, _OTHER_PROJECT; see the README). slurm/notify_mail.py is an example that mails the job's
# user. Empty means no notification. Default: []
notify_command = []

# One [[nodes]] table per compute node (at least one is required).
[[nodes]]
name = "example-host"        # slurm NodeName (required)
cpus = 8                     # CPUs slurm may hand out (required)
real_memory_mb = 64000       # RealMemory in MB slurm may hand out (required)
# Cores held for GPU jobs, per GPU: a GPU job gets this many per GPU by default, and CPU-only jobs (partitions
# partition cpu, capped by MaxCPUsPerNode) never use them, so a free GPU never waits for cores. Set it
# from a measurement: the fewest cores at which your GPU jobs stop getting faster. Unset: nothing is held, and a
# GPU job's default is its GPUs' share of the node's cores (all of them on a one-GPU node). Optional.
# cores_per_gpu = 4
# Memory jobs may use on this node (decimal GB, below real_memory_mb); slurm keeps the rest for work outside its jobs
# (MemSpecLimit). On a full node, measure it: after a week or more of the agent running, `python3 slurm/status.py
# --reserve` prints the figure (real memory less the 99th percentile of use outside jobs less close_below_gb). On a
# part-time machine it is what its owner lends. Default: no reserve (jobs may be given all of real_memory_mb). Optional.
# jobs_memory_gb = 48

# A part-time node is someone's own machine lent to the cluster when idle (needs a full node to run slurmctld on).
# It has no GPUs. A CPU-only `resume` job goes to its `part_time` partition when submit.py finds the job portable to it
# (default_jobs below), or always when the submitter vouches for it (submit.py --anywhere). Optional keys, only with part_time:
# part_time = true
# address = "100.64.0.2"   # slurm NodeAddr: where the controller reaches it (required)
# keep_cpus = "12-21"          # CpuSpecList: OS CPUs slurm never gives jobs, e.g. "0-11" or "0,2,4-7". Default: none kept
# jobs_memory_gb = 20          # what the owner lends to jobs (any node may set it; see above)
# cores_per_socket = 16        # CoresPerSocket as `slurmd -C` prints it on the machine, when that is not cpus: a hybrid Intel CPU
#                              # (6 two-thread + 10 one-thread cores) is 22 CPUs but 16 cores, and slurm drains a node whose
#                              # configured sockets*cores*threads exceeds what it reports ("Low socket*core*thread count"). Default: cpus
# default_jobs = false         # keep this node opt-in: only submit.py --anywhere sends a job here. Default: true (a portable job may go unasked)
# Health check keys, any node (see [health_check]):
# mains_only = true            # close the node while on battery. Default: decided at run time (true when it has a battery)
# close_below_gb = 6           # close the node below this much free memory (decimal GB). Default: 16 full, 6 part-time
# push_back_below_gb = 2       # requeue the newest resume job below this much free memory. Default: 10 full, 2 part-time

# One [[nodes.gpus]] table per GPU on that node, belonging to the [[nodes]] table above it. May be omitted.
[[nodes.gpus]]
index = 0                                        # GPU index
uuid = "GPU-00000000-0000-0000-0000-000000000000"  # nvidia-smi --query-gpu=uuid --format=csv,noheader
device = "/dev/nvidia0"                          # device file for gres.conf
type = "gb10"                                    # gres type name
# Optional. Let several jobs share this card at once (slurm gres/shard): the card is cut into this many shards and a job
# asks for some of them (submit.py). "cores" gives one shard per core the node holds for a card (cores_per_gpu above, which
# it then requires); a whole number from 1 to 1024 is also accepted. Absent or 0: the card is one token, one job at a time.
# Adding shards to a running cluster needs slurmctld and slurmd restarted (23.11) or reconfigured (26.05); never reduce them
# while shard jobs run.
# shards = "cores"

# Optional. Leave the whole table out when no other service shares the GPU through the lease.
[lease]
lease_dir = "/var/lib/gpujobs/gpu-lease"      # directory of lease files (required)
keeper_user = "gpujobs"                       # user the lease keeper runs as (required)
python = "/opt/gpujobs/venv/bin/python"       # interpreter with localmodels installed (required)

# Services that yield the card when asked: name = "how and how fast it yields". Default: none
[lease.services]
# myservice = "yields within about 1 min"

# Optional. Other sites this one can send jobs to (`submit.py --site NAME --repo R --entry E [--data DIR]`): the job's code
# (the import closure of the entry script) and --data folders are copied there by checksum under root/<project>/, then that
# site's own submit command runs over ssh. One table per site; the job is then watched with that site's own tools.
# [remote.turing]
# host = "site-b"           # ssh destination
# root = "gpujobs-sync"     # relative to the login home, or absolute
# submit_command = "gpujobs-submit"   # optional; these are the defaults
# status_command = "gpujobs-status"
# data_root = "/data/shared/datasets"   # optional, absolute: where --data folders from OUTSIDE the repo land there

# Optional. A `service` partition for background services' CPU stand-ins (submit.py --service): started at once by
# suspending CPU-only jobs, never touching GPU jobs. Leave the table out when no service has one.
# [service]
# cores = 4                    # per node, at most the cores CPU-only jobs may use (required)
# group = "gpujobs-service"    # Unix group allowed to submit; install.py service add USER. Default: gpujobs-service

# Optional. Build and install this SchedMD slurm release instead of the distribution's. Both fields or neither;
# leave the table out for the distribution's packages.
# [slurm]
# version = "26.05.5"          # the release (required with sha256)
# sha256 = "4680cafc82b0689865c885eb703441e7ebf764896c40fd03a50f2fcb60664f68"   # its tarball's digest (required with version)
# steps = ["25.05.9:7be633820df896df819ac2e9f2ebd0824de509515e5fb78ba1c19da2453b39ed"]   # releases `install.py upgrade-slurm` passes through first, "<version>:<sha256>", ascending, each older than version

# Watch SchedMD's releases and prove a newer one in the test cluster before a maintenance window installs it
# (slurm/slurm_release.py; README "[slurm_release]"). Needs [slurm]. Absent: no watch.
# [slurm_release]
# checkout = "/opt/src/gpujobs"  # a checkout of these tools with tests/integration
# records = "/var/lib/gpujobs-release"  # test results: owned by test_user or root, writable by nobody else
# test_user = "admin1"         # runs the nightly check and the test; must be an admin
# follow = "series"            # patch | series (also the next series once it has its x.y.1). Default: series
# project = "gpujobs"          # the project the test job is submitted under. Default: gpujobs

# A restart slot of the site's own (a weekly window run outside these tools) writes status_file; the jobs page shows
# its admins what waits for a restart, and its Restart now / Skip this week buttons leave a request in request_dir,
# which that slot decides on. Both or neither; absent: no banner.
# [maintenance]
# status_file = "/var/lib/restart-slot/status.json"
# request_dir = "/var/lib/restart-slot/requests"

# Optional. slurmd runs slurm/node_check.py on every node each interval (as root): it closes a node that is low on
# memory (or on battery) and reopens it, and requeues a resume job when memory is lower still. Per-node thresholds are
# in [[nodes]]; settings are rendered to /etc/gpujobs/node_check.json. Leave the table out for no health check.
# [health_check]
# interval_s = 30              # seconds between checks (slurm HealthCheckInterval). Default: 30

[metrics]
mode = "off"            # local (install Prometheus and Grafana here), external (use the URLs below), or off. Default: off
prometheus_url = ""     # used when mode = "external". Default: empty
grafana_url = ""        # used when mode = "external". Default: empty
grafana_port = 3000     # port for the local Grafana. Default: 3000
retention_days = 365    # how long Prometheus keeps samples. Default: 365
allow_from = []         # networks that may reach Grafana and the exporters, e.g. ["100.64.0.0/10"]; the machine
                        # itself always may. Default: empty (any network)

[portal]
mode = "off"            # install (Open OnDemand here), existing (reuse one), or off. Default: off
auth = "dex-local"      # oidc, dex-ldap, dex-local or proxy (no sign-in page; see below). Default: dex-local
server_name = ""        # host name the portal answers to; required when mode = "install". Default: empty
tls_cert = ""           # path to the certificate; empty means none. Default: empty
tls_key = ""            # path to its key; empty means none. Default: empty
session_days = 0        # how long one sign-in lasts, across browser restarts and reboots; 0 = OOD's 8 hours. Default: 0
allow_from = []         # networks that may reach the portal (include the portal's own address). Default: empty (any)

# Extra settings for the chosen auth mode, as string keys and values. Default: none
[portal.auth_settings]
# oidc:      issuer, client_id, client_secret_file, then optional remote_user_claim, scope, user_map_match
# dex-ldap:  host, user_base_dn, then optional bind_dn, bind_pw_file, user_filter, username_attr, email_attr, root_ca, start_tls
# dex-local: users_file
# oidc, dex-ldap and dex-local also take the optional crypto_passphrase_file.
# proxy:     no sign-in page. A reverse proxy you trust (on a private network, e.g. Caddy on a Tailscale host) adds a
#            secret header, X-Frontdoor-Key, to every request; the portal refuses (403) any request without the
#            right one, removes the header before the apps see it, and serves every request as one Linux user.
#            Needs portal.allow_from set to the proxy's address, or anyone who can reach the portal is that user.
#            user:     the Linux user every request is served as (required)
#            key_file: absolute path of a root-only file holding the key (16 or more characters, no spaces), made
#                      with: openssl rand -hex 32 | sudo install -m 0600 /dev/stdin /etc/gpujobs/portal/proxy_key
#                      Put the same value in the proxy, e.g. Caddy: header_up X-Frontdoor-Key <the key>
#            Only the key's SHA-1 digest goes into the portal's Apache config, never the key itself.
# user = "alice"
# key_file = "/etc/gpujobs/portal/proxy_key"
