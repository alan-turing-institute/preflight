# Design 3.11. A slurm job sees the GPU only if it holds the gpu:1 token; its processes stay on its cores; its
# CPU-side memory is capped at its --mem (GPU memory is not charged to the cgroup on a unified-memory GPU such as the GB10 (trial B2), so the
# host memory guard still covers that side). Processes outside slurm are untouched.
CgroupPlugin=autodetect
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainDevices=yes
