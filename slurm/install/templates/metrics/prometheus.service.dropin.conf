# Runs the distro Prometheus on the gpujobs configuration instead of /etc/default/prometheus.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus --config.file=${config_file} --storage.tsdb.path=/var/lib/prometheus/metrics2 --storage.tsdb.retention.time=${retention_days}d --web.listen-address=127.0.0.1:${prometheus_port}
