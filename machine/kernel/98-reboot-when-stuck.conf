# Reboot when the kernel detects it is stuck, instead of staying frozen for hours.
# Written 2026-10-12: the Turing DGX froze on 2026-10-10 23:40 and stayed down 35 h with its
# hardware watchdog live (so the kernel itself was still running), and it had none of these
# set. A task stuck for more than kernel.hung_task_timeout_secs (120 s) matches the symptom in
# NVIDIA's forum report of GB10 boxes freezing instead of reporting out-of-memory (a driver
# thread in uninterruptible sleep for over 122 s). False-alarm risk: our box logged zero
# "blocked for more than 120 seconds" lines in every boot since 2026-09-27, and both boxes
# had only local NVMe disks. Revisit if a box reboots with no freeze behind it.
# 2026-10-18: it did. Our box now mounts NAS shares (/mnt/shared, hard NFS mounts), and at 18:59
# a multi-threaded fetcher writing to /mnt/shared/SharedData hung on an NFS rename the NAS never
# answered; the threads queued behind it on the folder lock counted as stuck, and the box
# rebooted with no freeze behind it (crash log /var/lib/systemd/pstore/1792346342/). The
# limit is raised to 600 s so a NAS stall of up to 10 minutes no longer reboots the box; a
# real freeze is still caught, a few minutes later, which is nothing against the 35 h it
# replaces. Long or parallel writes to the NAS go to local disk first (~/.claude/CLAUDE.md).
kernel.panic = 10
kernel.panic_on_rcu_stall = 1
kernel.softlockup_panic = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 600
