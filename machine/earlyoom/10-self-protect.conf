# Lets earlyoom's -p flag actually work. Ubuntu's unit runs it under DynamicUser=true with
# only CAP_KILL and CAP_IPC_LOCK, so -p failed twice at every start with 'Could not set
# priority: Permission denied' / 'Could not set oom_score_adj: Permission denied' and carried
# on regardless -- a flag that logs its own failure and is ignored.
# CAP_SYS_NICE covers the niceness -20, CAP_SYS_RESOURCE the oom_score_adj -100. The point is
# that the guard must not itself be a candidate for the shortage it exists to resolve.
[Service]
AmbientCapabilities=CAP_KILL CAP_IPC_LOCK CAP_SYS_NICE CAP_SYS_RESOURCE
