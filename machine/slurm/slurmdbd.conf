# slurm's accounting daemon on gpu-node-1 (design 3.1, added 2026-10-16). Without it, slurm 23.11 marks every job
# "invalid account": the main scheduler skips them, so jobs started only on the 30-s backfill pass and
# kill_invalid_depend never cancelled a failed chain (stage C test 7). Source of truth; /etc/slurm/slurmdbd.conf
# is the install target, installed 0600 and owned by slurm by install_slurm.py, as slurmdbd requires.
# The database login is MariaDB's unix_socket authentication for the OS user `slurm`: no password anywhere.
AuthType=auth/munge
DbdHost=localhost
SlurmUser=slurm
LogFile=/var/log/slurm/slurmdbd.log
# The unit's RuntimeDirectory, owned by slurm (/run itself is not writable by slurm).
PidFile=/run/slurmdbd/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=localhost
StorageUser=slurm
StorageLoc=slurm_acct_db
