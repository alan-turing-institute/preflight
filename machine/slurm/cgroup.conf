# Track, do not enforce: the host memory guard (preflight/hostguard) caps torch; a slurm memory limit on top of it
# would kill jobs the guard was built to keep alive. Devices are not constrained during the trial (jobs outside slurm
# use the GPU).
CgroupPlugin=autodetect
ConstrainCores=no
ConstrainRAMSpace=no
ConstrainDevices=no
