# Installed at /etc/systemd/system.conf.d/60-hardware-watchdog.conf (then `systemctl daemon-reexec`).
#
# WHY: on a DGX Spark a GPU job that exhausts the unified memory pool can livelock the box
# (kswapd spinning, nothing killed). It then stays down until someone power-cycles it --
# gpu-node-1 on 2026-10-06, the Turing DGX (gpu-node-2) on 2026-10-07. The board has a
# hardware watchdog (`SBSA Generic Watchdog`, /dev/watchdog0) that systemd leaves off by
# default. With this, the board reboots the box if systemd stops responding for 60 s.
#
# It is the LAST line, not the guard: it only fires if PID 1 itself stalls, which a thrash
# need not cause. earlyoom (machine/earlyoom) and hostguard are what keep a box alive; this
# bounds how long a hang that gets past them can last. Pair with kernel.panic = 10 so a
# kernel crash reboots too.
[Manager]
RuntimeWatchdogSec=60s
