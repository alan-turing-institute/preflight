# SLURM on gpu-node-1, one node. Design: design notes (revision 2, section 3.1);
# trial: build notes. Source of truth; /etc/slurm/slurm.conf is the install target.
ClusterName=spark
SlurmctldHost=gpu-node-1
AuthType=auth/munge
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# A node set DOWN for not responding returns by itself; one DOWN after an unexpected reboot waits for a person
# (slurm/resume.py --node), so a job that wedged the box is not restarted into the same wedge.
ReturnToService=1
# A requeued job may start again this many seconds after it was requeued (site requeue_delay_s; slurm's default 120 s).
AuthInfo=cred_expire=60
# A job whose dependency failed is cancelled, not left pending forever; a finished job stays known for a day,
# so a step can still be chained onto it.
# (DependencyParameters, not SchedulerParameters: set under the latter on 2026-10-16 it did nothing, stage C test 7.)
DependencyParameters=kill_invalid_depend
MinJobAge=86400
MpiDefault=none

# Processes are tracked by cgroup (v2, autodetected); devices, cores and CPU-side memory are constrained (cgroup.conf).
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup

# Cores and memory are consumable; a job states --mem (default 16 GiB when it does not). The GPU is one token.
# Backfill (slurm's default): a waiting job keeps its place, and later jobs start in what it cannot use (CPU jobs beside a
# job waiting for the card). The simpler sched/builtin was tried 2026-11-04..07 (D31) and dropped (D38): a job that cannot
# start takes its partition's NODES from every lower tier, and every partition here shares the one node, so one GPU job
# waiting for the card held every CPU job (slurm 26.05.5 job_scheduler.c, PART_FLAG_SCHED_CLEARED). Known gap: no job has
# a time limit (D4), so backfill cannot plan ahead and a later card-sharing job may take what a waiting whole-card job needs.
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerNode=16384
GresTypes=gpu

# Pre-emption by partition priority, no accounting database: an `urgent` job takes resources from `normal` jobs,
# which are requeued (SIGTERM to every process of the job, then SIGKILL after KillWait) and start again when resources free.
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE
JobRequeue=1
# Seconds between SIGTERM and SIGKILL when a job is ended, pre-emption included (measured 2026-10-16: the
# 30-s default was the interval after a pre-emption): room for a large checkpoint to be written.
KillWait=120

# Accounting through slurmdbd (slurmdbd.conf beside this file): without it slurm 23.11 marks every job
# "invalid account", so only the 30-s backfill pass started jobs and failed chains were never cancelled
# (stage C, 2026-10-16). It also records each job's GPU use (`sacct`), which this box's ledger never had.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations
# Finished-job records (job id, start, end, state) to a text file as well, as before.
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

# RealMemory: what slurm hands out once the background services have stepped aside: physical 124,610 MB minus
# the base use with the GPU idle and the box quiet (median 12,132 MB, flight recorder 2026-10-12..16) minus the
# host memory guard's 12 GiB.
NodeName=gpu-node-1 CPUs=20 Boards=1 SocketsPerBoard=1 CoresPerSocket=20 ThreadsPerCore=1 RealMemory=100000 Gres=gpu:1 State=UNKNOWN
# normal: resumes from its checkpoint, pre-emptable. steady: cannot resume, never pre-empted. urgent:
# slurm/urgent.py only. NO GraceTime (measured 2026-10-16, stage C test 3): with GraceTime=120 a batch job's
# command never received SIGTERM, the urgent job waited 150 s, and the job was killed 30 s after the grace.
# Without it (the trial) every process of the job gets SIGTERM at once; KillWait below is the time to save.
PartitionName=normal Nodes=gpu-node-1 Default=YES PriorityTier=1 PreemptMode=REQUEUE MaxTime=INFINITE State=UP
PartitionName=steady Nodes=gpu-node-1 PriorityTier=1 PreemptMode=OFF MaxTime=INFINITE State=UP
PartitionName=urgent Nodes=gpu-node-1 PriorityTier=2 PreemptMode=OFF MaxTime=INFINITE State=UP
