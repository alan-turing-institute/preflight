# Design 3.1 (design notes): the slurm daemons restart after a crash (they shipped
# with Restart=no, no, on-abort) and are never the kernel's out-of-memory choice. Installed as a drop-in for
# slurmctld, slurmd and munge by install_slurm.py.
[Service]
Restart=on-failure
RestartSec=5
OOMScoreAdjust=-900
