# Integration test cluster: one container running systemd, slurm (controller, node, accounting) and MariaDB, and a second
# one that plays a part-time machine (the e2e `part_time` stage).
# Project name gpujobs-test. Driven by run.sh; do not start it with a bare `docker compose up`.
name: gpujobs-test

# Both services are the same image and the same limits; the second one runs only munge and slurmd.
x-node: &node
  image: ${GPUJOBS_TEST_IMAGE:-gpujobs-testcluster:dev}
  build:
    context: .
    # slurm_build.py comes from the repository; SLURM_VERSION/SLURM_SHA256 (both or neither) pick SchedMD's slurm.
    additional_contexts:
      src: ../..
    args:
      SLURM_VERSION: ${SLURM_VERSION:-}
      SLURM_SHA256: ${SLURM_SHA256:-}
  # Torn down with `run.sh down`; nothing here outlives a test run.
  labels:
    lifecycle: ephemeral
  pids_limit: 2048
  # systemd as PID 1 without --privileged: its own cgroup namespace (Docker's default on cgroup v2) with a writable
  # /sys/fs/cgroup, a tmpfs /run and /tmp, and SIGRTMIN+3 for a clean stop (set in the Dockerfile).
  cgroup: private
  security_opt:
    - writable-cgroups=true
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  # The repository, read-only, where the installer and the tools are exercised from.
  volumes:
    - ../..:/src:ro
    # slurm_build.py's package cache outlives `run.sh down` (external volume), so a release is compiled once, not per run.
    - slurm-build-cache:/var/cache/gpujobs/slurm

services:
  cluster:
    <<: *node
    hostname: testnode
    # The part-time node reaches the controller by this name (slurmd --conf-server testnode).
    networks:
      default:
        aliases:
          - testnode
    # The box runs real GPU jobs: cap the harness well under it, and give it no GPU, no host network, no published ports.
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4

  # A part-time machine: someone's own computer joining as a configless slurmd (e2e.py, stage part_time). It has no GPU
  # and less memory; its own systemd units for slurm's controller side and MariaDB are switched off by the stage.
  part-time:
    <<: *node
    hostname: pt1
    networks:
      default:
        aliases:
          - pt1
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2

volumes:
  slurm-build-cache:
    external: true
    name: gpujobs-slurm-build-cache
