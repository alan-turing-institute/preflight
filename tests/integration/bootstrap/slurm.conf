# Bootstrap slurm configuration for the integration test cluster: one node, fake GPUs, accounting through slurmdbd.
# F1's installer replaces this with the files rendered from the harness site file.
ClusterName=harness
SlurmctldHost=testnode
AuthType=auth/munge
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ReturnToService=1
MpiDefault=none
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerNode=512
# Fake GPUs: a count with no device files (gres.conf has no File).
GresTypes=gpu
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations
JobCompType=jobcomp/none
# The container sees all of the box's CPUs and memory but is capped by cgroup limits (compose.yml); the configured
# node is what slurm hands out, so ignore the hardware probe (otherwise it logs a mismatch on every start).
SlurmdParameters=config_overrides
# The container is capped at 4 CPUs and 8 GiB (compose.yml); the node offers 4 CPUs and 4 GiB of that.
NodeName=testnode CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=4096 Gres=gpu:4 State=UNKNOWN
PartitionName=normal Nodes=testnode Default=YES MaxTime=INFINITE State=UP
