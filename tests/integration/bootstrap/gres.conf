# Four fake GPUs for the harness. slurm 23.11.4 does not accept them as a bare count: with `Name=gpu Count=4` (and with
# Flags=CountOnly) slurmd logs "Ignoring file-less GPU gpu:(null) from final GRES list" and the node is set INVAL
# ("gres/gpu count reported lower than configured (0 < 4)"); with File=/dev/null and Count=4 it exits with
# "Invalid GRES record for gpu, count does not match File value". Four File entries work; they are symlinks to
# /dev/null made in the Dockerfile.
NodeName=testnode Name=gpu File=/opt/fakegpu/gpu[0-3]
