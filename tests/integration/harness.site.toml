# Site file for the integration test cluster (tests/integration/README.md): what an operator would write for the
# container, installed by e2e.py through the real installer. Differences from a real box are noted where they occur.
name = "harness"
cluster_name = "harness"          # the container's bootstrap accounting database already knows this cluster
# account: the default, gpujobs. The container's first-boot unit created cluster and users in account "harness", so the
# installer has to create account "gpujobs" (and each user's membership) itself.
state_dir = "/var/lib/gpujobs"
install_dir = "/opt/gpujobs"
admin_group = "gpujobs-admin"
unified_memory = false
hostguard = true                  # the installed job wrapper must find hostguard beside install_dir/slurm
dgx_gate = false
# Containers cannot load slurm's BPF device filter, which 26.05 treats as fatal (23.11 only logged it); real machines keep true.
constrain_devices = false
requeue_delay_s = 20              # shorter than a real box's 60 s: the checks that wait out a requeue run sooner
notify_command = ["/usr/local/bin/harness-notify"]   # e2e.py installs this script; the agent runs it on a failure

# The container's node as the bootstrap slurm.conf declares it. Four fake GPUs: slurm 23.11.4 refuses a bare count,
# so each is a symlink to /dev/null (README, "Fake GPUs").
[[nodes]]
name = "testnode"
cpus = 4
real_memory_mb = 4096
# The health check runs here too (HealthCheckNodeState=ANY). It reads the real /proc/meminfo, which is the host's: the
# thresholds are as low as the site file allows (positive) so this node never closes, whatever else the box is doing.
close_below_gb = 0.001
push_back_below_gb = 0.001
mains_only = false

[[nodes.gpus]]
index = 0
uuid = "GPU-00000000-0000-0000-0000-000000000000"
device = "/opt/fakegpu/gpu0"
type = "fake"

[[nodes.gpus]]
index = 1
uuid = "GPU-00000000-0000-0000-0000-000000000001"
device = "/opt/fakegpu/gpu1"
type = "fake"

[[nodes.gpus]]
index = 2
uuid = "GPU-00000000-0000-0000-0000-000000000002"
device = "/opt/fakegpu/gpu2"
type = "fake"

[[nodes.gpus]]
index = 3
uuid = "GPU-00000000-0000-0000-0000-000000000003"
device = "/opt/fakegpu/gpu3"
type = "fake"
# The `sharing` stage's card: six shards, three jobs of two. The number form, not shards = "cores": that needs the node's
# cores_per_gpu, and the 4-core node cannot hold a core for each of 4 cards and still leave CPU-only jobs one (site_config
# refuses it). Every other stage still gets whole-card jobs; only a job that asks for shards uses this one.
shards = 6

# The part-time machine: the second container (compose.yml, service part-time), a configless slurmd the `part_time` stage
# brings up. Default thresholds for a part-time node (close below 6 GB free, push back below 2 GB); the stage fakes the
# free memory it sees.
[[nodes]]
name = "pt1"
cpus = 2
real_memory_mb = 4096
part_time = true
address = "pt1"                   # the compose network alias
jobs_memory_gb = 3.5
mains_only = false                # the container has no battery either way; explicit so no hardware decides

# Every node runs node_check.py each interval_s; short, so the scenarios run in seconds, not minutes.
[health_check]
interval_s = 10

# No [lease]: nothing else shares the container's fake GPUs.

# A service partition (D20), as this box has: the agent suspends cpu jobs to make room for its jobs.
[service]
cores = 2

[metrics]
mode = "local"
grafana_port = 3001
# Grafana serves plain HTTP only, and a browser blocks that inside the HTTPS portal (mixed content). The harness
# reaches it through a TLS front added by e2e.py (an Apache virtual host on 3443 that proxies to 3001):
grafana_url = "https://testnode:3443"

[portal]
mode = "install"
auth = "dex-local"
server_name = "testnode"
session_days = 30  # exercises the persistent-cookie session through OOD's real generator and Apache

[portal.auth_settings]
users_file = "/etc/gpujobs/portal/users.json"
